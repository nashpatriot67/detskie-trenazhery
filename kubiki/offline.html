function courseView(){const sections=[...new Set(COURSE.map(l=>l.section))];return intro('ОТ ПЕРВОГО КУБИКА ДО СОТНИ','Твой маршрут открытий','Все уроки открыты. Начни с первого или выбери то, что хочется потренировать.')+sections.map(s=>`<section class="course-section"><div class="section-heading"><h2>${esc(s.split('•')[1].trim())}</h2><span>${COURSE.filter(l=>l.section===s).length} уроков</span></div><div class="course-grid">${COURSE.filter(l=>l.section===s).map(l=>`<button class="course-card ${state.lesson===l.id?'selected':''} ${solvedCount(l.id)===18?'done':''}" data-lesson="${l.id}"><div class="course-card-top"><span class="course-card-number">${String(l.id).padStart(2,'0')}</span><span class="muted">${solvedCount(l.id)}/18 ${solvedCount(l.id)===18?'✓':''}</span></div><h3>${esc(l.title)}</h3><p>${l.example.a} ${l.example.op==='-'?'−':'+'} ${l.example.b} = ?</p><div class="progress-bar"><i style="width:${solvedCount(l.id)/18*100}%"></i></div><span class="course-card-link">Открыть урок ${icon('arrow')}</span></button>`).join('')}</div></section>`).join('');}
function workshop(){return intro('МЕСТО ДЛЯ ЭКСПЕРИМЕНТОВ','Мастерская чисел','Собери любое число, разбери десяток и посмотри, как всё устроено.')+`<section class="lesson-panel workshop-panel"><div class="lesson-heading"><span class="lesson-number">${icon('build')}</span><div><h2 class="lesson-title">Что построим сегодня?</h2><p class="lesson-subtitle">У каждой палочки десять кубиков. У квадрата — сто.</p></div></div><div class="activity-wrap"><div class="free-controls"><label for="free-target">Собери число <input id="free-target" type="number" min="0" max="100" value="${state.freeTarget}"></label><button class="btn secondary" data-action="random-target">Другое число ↻</button></div><div class="board single-board">${zone('a','Твоя мастерская','Нажми на кубик на поле, чтобы вернуть его в коробку')}</div>${bank()}${exchangeTools()}<div class="board-actions"><div class="action-buttons"><button class="btn ghost" data-action="reset">${icon('reset')} Очистить</button><button class="btn ghost" data-action="undo" ${!state.undo.length?'disabled':''}>Отменить</button></div><button class="btn primary" data-action="check-free">Проверить сборку ${icon('check')}</button></div>${feedbackView()}<div class="tip-inline">${icon('bulb')} Количество при обмене не меняется: 10 единиц = 1 десяток.</div></div></section>`;}
function progressView(){const count=allSolved(),complete=COURSE.filter(l=>solvedCount(l.id)===18).length;return intro('ТЫ УЖЕ СТОЛЬКО УМЕЕШЬ','Каждый шаг считается','Здесь растёт твоя коллекция маленьких побед.')+`<div class="stat-row"><div class="stat-card"><span class="stat-icon">${icon('check')}</span><strong>${count}<small> / 648</small></strong><span>заданий решено</span></div><div class="stat-card"><span class="stat-icon lavender">${icon('grid')}</span><strong>${complete}<small> / 36</small></strong><span>уроков пройдено</span></div><div class="stat-card"><span class="stat-icon gold">${icon('star')}</span><strong>${Math.round(count/648*100)}<small>%</small></strong><span>всего курса</span></div></div><section class="lesson-panel progress-panel"><h2>Твоя карта уроков</h2><div class="progress-map">${COURSE.map(l=>`<button class="map-item ${solvedCount(l.id)===18?'done':solvedCount(l.id)?'started':''}" data-lesson="${l.id}" aria-label="Урок ${l.id}: ${esc(l.title)}, решено ${solvedCount(l.id)} из 18"><span>${solvedCount(l.id)===18?icon('check'):l.id}</span><small>${solvedCount(l.id)}/18</small></button>`).join('')}</div><p class="muted">${memory?'Хранилище браузера недоступно: прогресс сохраняется только до закрытия страницы.':'Прогресс сохраняется автоматически в этом браузере на этом устройстве.'}</p><div class="board-actions"><button class="btn ghost" data-action="reset-progress">Начать курс заново</button><button class="btn primary" data-view="trainer">Продолжить ${icon('arrow')}</button></div></section><div class="milestone">${icon('star')} ${count===0?'Первое открытие впереди. Начнём с одного кубика?':count<18?'Отличное начало! Впереди ещё много открытий.':complete===36?'Все уроки пройдены. Ты настоящий мастер кубиков!':'Ты молодец! Продолжай в своём темпе.'}</div>`;}
function render(){
 const context=`${state.view}:${state.lesson}:${state.mode}:${state.demo}:${state.index}`;
 const same=$('#app').dataset.context===context;
 const focusId=document.activeElement?.id;
 const answer=same?$('#answer')?.value:'';
 const inputs=same?$$('[data-ws-input]').map(el=>({index:el.dataset.wsInput,value:el.value,wrong:el.getAttribute('aria-invalid')==='true'})):[];
 $('#app').innerHTML=shell(state.view==='trainer'?trainer():state.view==='course'?courseView():state.view==='workshop'?workshop():progressView());
 $('#app').dataset.context=context;
 if(answer&&!state.solved&&$('#answer'))$('#answer').value=answer;
 inputs.forEach(item=>{const el=$(`[data-ws-input="${item.index}"]`);if(el&&!el.disabled){el.value=item.value;if(item.wrong){el.setAttribute('aria-invalid','true');el.closest('.worksheet-item').classList.add('wrong');}}});
 if(focusId&&$('#'+focusId))$('#'+focusId).focus({preventScroll:true});
 if(state.selected){const el=$(`[data-from="${state.selected.from}"][data-piece="${state.selected.type}"]`);if(el)el.classList.add('selected-piece');}
}
function renderFresh(){if($('#answer'))$('#answer').value='';render();}
function mutate(fn){if(state.solved)return;history();if(fn()===false){state.undo.pop();return;}state.selected=null;state.feedback=null;render();}
function movePiece(from,to,type){mutate(()=>K.move(state.zones,from,to,type));$(`[data-zone="${to}"]`)?.focus({preventScroll:true});}
function hint(){
 if(state.mode==='worksheet'){feedback('Впиши число в пустое окошко. Нажми на значок кубика у примера, чтобы решить его на поле.');render();return;}
 const t=task(),p=state.zones.a;
 let text=isBuild()?`Собери число на месте вопроса: ${esc(t.text||`${t.a} ${t.op} ${t.b} = ?`)}. Палочка — 10, кубик — 1.`:t.op==='+'?(K.total(state.zones.b)>0?'Перенеси кубики из правой группы в левую. Можно нажать «Соединить всё».':p.unit>=10?'На поле 10 или больше единиц. Нажми «10 единиц → десяток».':p.ten>=10?'Десять десятков — это сотня. Собери её кнопкой обмена.':'Посчитай десятки и единицы на левом поле, затем запиши ответ.'):(K.total(state.zones.removed)>t.b?'Ты убрал больше, чем нужно. Верни лишние кубики или отмени последнее действие.':p.unit<t.b%10-(state.zones.removed.unit%10)&&p.ten>0?'Не хватает отдельных единиц? Нажми «Десяток → 10 единиц».':p.hundred>0&&t.b>0?'Разбери сотню на 10 десятков, затем убирай нужные палочки и кубики.':`Справа должно оказаться ровно ${t.b}. Остальное останется слева — это ответ.`);
 feedback(text);render();
}
function checkAnswer(){const t=task(),raw=$('#answer').value.trim();if(!/^\d{1,3}$/.test(raw)){feedback('Впиши пропущенное число в окошко ответа.','error');render();$('#answer').focus();return;}
 if(Number(raw)!==t.answer){feedback('Пока не сходится. Посчитай кубики ещё раз. Можно воспользоваться подсказкой.','error');render();return;}
 if(!K.check(t,state.zones,isBuild())){feedback(isBuild()?'Число верное! Теперь собери его на поле. Единиц должно быть меньше 10 — собирай их в десятки.':t.op==='+'?'Ответ верный! Осталось перенести все кубики влево и собрать полные десятки.':'Ответ верный! Теперь покажи вычитание: убери нужное количество вправо, а ответ оставь слева.','hint');render();return;}
 state.solved=true;state.selected=null;if(!state.demo){progress.solved[`${state.lesson}:${state.index}`]=true;save();}feedback(state.demo?'Всё получилось! Теперь попробуй задания из тетради.':solvedCount(state.lesson)===18?'Урок пройден! Все 18 заданий получились.':'Здорово! И ответ, и кубики на своих местах.','success');render();celebrate();}
function nextTask(){stopVoice();if(state.demo){state.demo=false;state.index=0;}else if(state.index<17){state.index++;}else{if(state.lesson<36)chooseLesson(state.lesson+1);else{state.view='progress';render();}return;}setup();renderFresh();}
function checkWorksheet(){let answered=0,correct=0,wrong=0;$$('[data-ws-input]:not(:disabled)').forEach(input=>{let v=input.value.trim();if(!v)return;answered++;const idx=+input.dataset.wsInput,t=tasks()[idx];if(/^\d{1,3}$/.test(v)&&Number(v)===t.answer){progress.solved[`${state.lesson}:${idx}`]=true;correct++;}else{wrong++;input.setAttribute('aria-invalid','true');input.closest('.worksheet-item').classList.add('wrong');}});save();if(correct){$$('[data-ws-input]:not(:disabled)').forEach(input=>{if(progress.solved[`${state.lesson}:${input.dataset.wsInput}`]){input.disabled=true;input.closest('.worksheet-item').classList.add('solved');}});}
 const text=!answered?'Впиши ответы хотя бы в один пример.':wrong?`Верно: ${correct}. Ещё подумай над ${wrong} — они отмечены розовым.`:`Отлично! Проверено верных ответов: ${correct}.`;state.feedback={text,type:wrong?'error':correct?'success':'hint'};render();announce(text);if(correct&&!wrong)celebrate();}
function celebrate(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const div=document.createElement('div');div.className='confetti';div.setAttribute('aria-hidden','true');div.innerHTML=Array.from({length:22},(_,i)=>`<i style="--x:${Math.random()*100}vw;--r:${Math.random()*600}deg;--delay:${Math.random()*.3}s;background:${['#64b9e5','#f6ce60','#93c7b6','#b8a4e3'][i%4]}"></i>`).join('');document.body.append(div);setTimeout(()=>div.remove(),1800);}
function modal(content){lastModalFocus=document.activeElement;$('#overlay').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="icon-btn modal-close" data-action="close-modal" aria-label="Закрыть">${icon('close')}</button>${content}</section></div>`;$('.modal-close').focus();}
let lastModalFocus=null;
function closeModal(){$('#overlay').innerHTML='';lastModalFocus?.focus();}
function help(){stopVoice();modal(`<span class="tip-icon">${icon('cube')}</span><h2 id="modal-title">Знакомься, это кубики</h2><p>Синий кубик — <b>1 единица</b>. Жёлтая палочка — <b>10 единиц</b>. Фиолетовый квадрат — <b>100</b>.</p><ol class="help-list"><li><b>Передвигай.</b> Перетаскивай кубик мышкой или пальцем. Или нажми на него, затем на нужную область. Клавиатурой: выбери кубик через Tab и Enter, затем перейди Tab к области и нажми Enter.</li><li><b>Меняй.</b> Десять кубиков можно собрать в палочку. Палочку можно разменять обратно. Количество остаётся прежним.</li><li><b>Проверяй.</b> Покажи действие на поле и впиши ответ. Если ошибёшься, подсказка поможет.</li></ol><p><b>В каждом уроке:</b> разбор, 16 примеров и 2 задания на сборку — как в твоём PDF.</p><p class="muted">В мастерской можно свободно собирать числа. Прогресс хранится в этом браузере. Задания в скачанном HTML работают без интернета. Для женской озвучки нужен интернет.</p><p class="muted"><a href="voice-credits.txt" target="_blank" rel="noopener">Об озвучке</a></p><button class="btn primary" data-action="download">${icon('download')} Скачать для занятий офлайн</button>`);}
async function download(){
 const button=$('[data-action="download"]');
 if(location.protocol==='file:'||location.protocol==='content:'){button.textContent='Задания работают офлайн, для озвучки нужен интернет';return;}
 button.disabled=true;
 try{
  const files=await Promise.all(['style.css','course.js','engine.js','voice-manifest.js','recorded-voice.js','app.js'].map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('fetch');return r.text();})));
  const head=document.head.innerHTML.replace(/<link rel="stylesheet" href="style\.css(?:\?[^"]*)?">/,()=>`<style>${files[0]}</style>`);
  const scripts='<script>window.VOICE_BASE_URL='+JSON.stringify(new URL('./',location.href).href)+';<\/script>'+files.slice(1).map(s=>'<script>'+s.replace(/<\/script/gi,'<\\/script')+'<\/script>').join('');
  const html='<!doctype html><html lang="ru"><head>'+head+'</head><body><div id="app"></div><div id="live" class="sr-only" aria-live="polite"></div><div id="overlay"></div>'+scripts+'</body></html>';
  const blob=new Blob([html],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='matematika-v-kubikah.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);button.textContent='Скачано — задания офлайн, озвучка через интернет';
 }catch(e){button.disabled=false;button.textContent='Не удалось скачать. Попробовать ещё раз';}
}
// Recorded lessons keep the same voice on every device. Unknown operands stay unknown.
let voiceSession=0,voicePlaying=false;
function voiceButton(){const button=$('[data-action="speak"]');if(!button)return;button.setAttribute('aria-label',voicePlaying?'Остановить озвучку':'Послушать задание женским голосом');button.setAttribute('aria-pressed',String(voicePlaying));button.setAttribute('title',voicePlaying?'Остановить':'Послушать');button.innerHTML=icon(voicePlaying?'close':'sound');}
function stopVoice(){voiceSession++;voicePlaying=false;if(window.RecordedVoice)window.RecordedVoice.stop();voiceButton();}
function spokenNumber(n){const units=['ноль','один','два','три','четыре','пять','шесть','семь','восемь','девять','десять','одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать','шестнадцать','семнадцать','восемнадцать','девятнадцать'],tens=['','','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто'];if(n===100)return 'сто';if(n<20)return units[n];return tens[Math.floor(n/10)]+(n%10?' '+units[n%10]:'');}
function taskVoice(){const t=task(),a=t.missing==='a'?'неизвестное число':spokenNumber(t.a),b=t.missing==='b'?'неизвестное число':spokenNumber(t.b);return [`${a} ${t.op==='+'?'плюс':'минус'} ${b}${t.missing!=='result'?` равно ${spokenNumber(t.result)}`:''}.`,isBuild()?'Собери пропущенное число.':'Передвинь кубики и запиши ответ.'];}
function speak(){
 if(voicePlaying){stopVoice();return;}
 if(!window.RecordedVoice){feedback('Не удалось загрузить озвучку. Проверь интернет и обнови страницу.','hint');render();return;}
 const id=++voiceSession;voicePlaying=true;voiceButton();
 const end=()=>{if(id!==voiceSession)return;voicePlaying=false;voiceButton();};
 const started=window.RecordedVoice.speak(state.mode==='learn'?`${lesson().title}. ${lesson().rule}`:taskVoice(),{onEnd:end,onError:message=>{if(id!==voiceSession)return;end();feedback(message||'Не удалось включить озвучку. Проверь интернет и нажми ещё раз.','hint');render();}});
 if(started===false)end();
}
// Delegated navigation keeps all controls available after a board redraw.
document.addEventListener('click',event=>{
 const el=event.target.closest('button,a');if(!el)return;
 if(el.dataset.lesson){chooseLesson(+el.dataset.lesson);return;}
 if(el.dataset.view){stopVoice();state.view=el.dataset.view;state.feedback=null;state.selected=null;if(state.view==='workshop'){state.solved=false;state.zones={a:K.empty(),b:K.empty(),removed:K.empty()};state.undo=[];}else if(state.view==='trainer')setup();renderFresh();window.scrollTo(0,0);return;}
 if(el.dataset.mode){stopVoice();state.mode=el.dataset.mode;state.feedback=null;state.selected=null;renderFresh();return;}
 if(el.dataset.practice){state.index=+el.dataset.practice;state.mode='play';state.demo=false;setup();renderFresh();return;}
 if(el.dataset.exchange){mutate(()=>K.exchange(state.zones.a,el.dataset.exchange));announce('Обмен выполнен. На поле '+K.total(state.zones.a));return;}
 if(el.dataset.piece){if(suppressClick){suppressClick=false;return;}if(state.solved)return;const from=el.dataset.from,type=el.dataset.piece;if(from==='bank'){movePiece(from,'a',type);return;}if(state.view==='workshop'){mutate(()=>{state.zones.a[type]--;return true;});return;}if(state.selected?.from===from&&state.selected?.type===type){state.selected=null;$$('.selected-piece').forEach(p=>p.classList.remove('selected-piece'));return;}state.selected={from,type};$$('.selected-piece').forEach(p=>p.classList.remove('selected-piece'));el.classList.add('selected-piece');announce('Кубик выбран. Нажми на область назначения.');return;}
 const action=el.dataset.action;if(!action)return;event.preventDefault();
 if(action==='home')chooseLesson(1);
 else if(action==='help')help();
 else if(action==='close-modal')closeModal();
 else if(action==='speak')speak();
 else if(action==='hint')hint();
 else if(action==='check')checkAnswer();
 else if(action==='check-worksheet')checkWorksheet();
 else if(action==='next-task')nextTask();
 else if(action==='prev-lesson')chooseLesson(Math.max(1,state.lesson-1));
 else if(action==='reset'){if(state.view==='workshop'){state.zones={a:K.empty(),b:K.empty(),removed:K.empty()};state.undo=[];state.feedback=null;state.solved=false;}else setup();renderFresh();}
 else if(action==='undo'){if(state.undo.length){state.zones=JSON.parse(state.undo.pop());state.selected=null;state.feedback=null;render();}}
 else if(action==='combine'){mutate(()=>{['unit','ten','hundred'].forEach(type=>{state.zones.a[type]+=state.zones.b[type];state.zones.b[type]=0;});return true;});}
 else if(action==='learn-back'){stopVoice();state.step=Math.max(0,state.step-1);render();}
 else if(action==='learn-next'){stopVoice();if(state.step<2){state.step++;render();}else{state.mode='play';state.demo=true;setup();if(!progress.read.includes(state.lesson))progress.read.push(state.lesson);save();renderFresh();}}
 else if(action==='random-target'){state.freeTarget=Math.floor(Math.random()*101);state.zones={a:K.empty(),b:K.empty(),removed:K.empty()};state.undo=[];state.feedback=null;render();}
 else if(action==='check-free'){feedback(K.total(state.zones.a)===state.freeTarget?K.canonical(state.zones.a)?`Получилось! Ты собрал ${state.freeTarget}: ${nice(state.freeTarget)}.`:`Число ${state.freeTarget} собрано! Теперь объедини полные десятки и сотню.`:`Сейчас на поле ${K.total(state.zones.a)}, а нужно ${state.freeTarget}. Добавь или убери кубики.`,K.total(state.zones.a)===state.freeTarget?'success':'hint');render();if(K.total(state.zones.a)===state.freeTarget&&K.canonical(state.zones.a))celebrate();}
 else if(action==='reset-progress')modal(`<h2 id="modal-title">Начать сначала?</h2><p>Будут удалены отметки о решённых заданиях на этом устройстве.</p><div class="board-actions"><button class="btn secondary" data-action="close-modal">Оставить прогресс</button><button class="btn primary" data-action="confirm-reset-progress">Начать заново</button></div>`);
 else if(action==='confirm-reset-progress'){progress={solved:{},read:[]};save();closeModal();chooseLesson(1);}
 else if(action==='download')download();
});
document.addEventListener('click',event=>{if(event.target.closest('[data-piece]'))return;const zone=event.target.closest('[data-zone]');if(zone&&state.selected){movePiece(state.selected.from,zone.dataset.zone,state.selected.type);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){stopVoice();if($('#overlay').innerHTML){closeModal();return;}state.selected=null;render();}if(e.key==='Enter'&&e.target.id==='answer')checkAnswer();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-zone]')){e.preventDefault();if(state.selected)movePiece(state.selected.from,e.target.dataset.zone,state.selected.type);}if(e.key==='Tab'&&$('.modal')){const fs=[...$('.modal').querySelectorAll('button,a,input')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===fs[0]){e.preventDefault();fs[fs.length-1].focus();}else if(!e.shiftKey&&document.activeElement===fs[fs.length-1]){e.preventDefault();fs[0].focus();}}});
document.addEventListener('input',e=>{if(e.target.id==='answer'||e.target.matches('[data-ws-input]')){e.target.value=e.target.value.replace(/[^0-9]/g,'');e.target.removeAttribute('aria-invalid');e.target.closest('.worksheet-item')?.classList.remove('wrong');}if(e.target.id==='free-target'){let n=Number(e.target.value);if(Number.isInteger(n)&&n>=0&&n<=100){state.freeTarget=n;state.feedback=null;}}});
document.addEventListener('change',e=>{if(e.target.id==='free-target'){e.target.value=state.freeTarget;}});
// Pointer events support mouse, stylus and touch, with a movement threshold for taps.
let drag=null, suppressClick=false;
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-piece]');if(!el||state.solved||e.button!==0)return;drag={id:e.pointerId,from:el.dataset.from,type:el.dataset.piece,x:e.clientX,y:e.clientY,active:false,el};el.setPointerCapture?.(e.pointerId);});
document.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;if(!drag.active&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>7){drag.active=true;const ghost=drag.el.cloneNode(true);ghost.classList.add('drag-ghost');ghost.removeAttribute('data-piece');ghost.removeAttribute('data-from');ghost.setAttribute('aria-hidden','true');document.body.append(ghost);drag.ghost=ghost;}if(drag.active){e.preventDefault();drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';$$('.drop-over').forEach(x=>x.classList.remove('drop-over'));document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-zone]')?.classList.add('drop-over');}},{passive:false});
function finishDrag(e,cancel=false){if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;d.ghost?.remove();$$('.drop-over').forEach(x=>x.classList.remove('drop-over'));if(d.active){suppressClick=true;setTimeout(()=>{suppressClick=false;},100);if(!cancel){const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-zone]');if(target)movePiece(d.from,target.dataset.zone,d.type);}}}
document.addEventListener('pointerup',e=>finishDrag(e));document.addEventListener('pointercancel',e=>finishDrag(e,true));
$('#overlay').addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))closeModal();});
// Zones are keyboard destinations even after dynamic updates.
const observer=new MutationObserver(()=>{$$('[data-zone]').forEach(z=>{z.tabIndex=0;});});observer.observe($('#app'),{childList:true,subtree:true});
setup();render();
</script>
</body></html>
