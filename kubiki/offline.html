const values={unit:1,ten:10,hundred:100};
const max=()=>root.MathRange?root.MathRange.MAX:1000;
function parts(n){if(!Number.isInteger(n)||n<0||n>max())throw new RangeError('Expected a whole quantity from 0 to '+max());return {unit:n%10,ten:Math.floor(n/10)%10,hundred:Math.floor(n/100)};}
const empty=()=>({unit:0,ten:0,hundred:0});
const total=p=>p.unit+10*p.ten+100*p.hundred;
const valid=p=>!!p&&Object.keys(values).every(type=>Number.isInteger(p[type])&&p[type]>=0)&&total(p)<=max();
// Ten hundreds is an intentional boundary model for 1000, explained in the UI.
const canonical=p=>valid(p)&&p.unit<10&&p.ten<10;
function move(zones,from,to,type){
 if(!zones||!Object.prototype.hasOwnProperty.call(values,type)||from===to)return false;
 if(to==='bank'){if(from==='bank'||!valid(zones[from])||zones[from][type]<1)return false;zones[from][type]--;return true;}
 if(!valid(zones[to]))return false;
 if(from!=='bank'&&(!valid(zones[from])||zones[from][type]<1))return false;
 if(total(zones[to])+values[type]>max())return false;
 if(from!=='bank')zones[from][type]--;
 zones[to][type]++;return true;
}
function canExchange(p,action){
 if(!valid(p))return false;
 return action==='pack'?p.unit>=10:action==='split'?p.ten>0:action==='pack100'?p.ten>=10:action==='split100'?p.hundred>0:false;
}
function exchange(p,action){
 if(!canExchange(p,action))return false;
 if(action==='pack'){p.unit-=10;p.ten++;return true;}
 if(action==='split'){p.ten--;p.unit+=10;return true;}
 if(action==='pack100'){p.ten-=10;p.hundred++;return true;}
 if(action==='split100'){p.hundred--;p.ten+=10;return true;}
 return false;
}
function check(task,zones,build){
 if(!task||!zones||!valid(zones.a)||(!build&&(!valid(zones.b)||!valid(zones.removed))))return false;
 const target=task.answer??task.result;
 if(!Number.isInteger(target)||target<0||target>max())return false;
 if(build)return total(zones.a)===target&&canonical(zones.a);
 return total(zones.a)===task.result&&canonical(zones.a)&&(task.op==='+'?total(zones.b)===0:total(zones.removed)===task.b);

add('pv.diag.predict-ten','predict','Предскажи новый десяток','Есть 2 десятка и 15 единиц. Обменяем ровно 10 единиц на десяток. Сколько сотен, десятков и единиц будет? Сначала запиши прогноз.',{initial:{hundred:0,ten:2,unit:15},prediction:[0,3,5],answer:35,exchangeAction:'pack',skillIds:['math.exchange.ten','math.placevalue.conservation'],lesson:3,diagnostic:true});
add('pv.diag.conservation-ten','conservation','Размен десятка','Размени один десяток на единицы. Количество стало больше, меньше или осталось тем же?',{initial:{hundred:0,ten:3,unit:2},answer:32,expected:{hundred:0,ten:2,unit:12},skillIds:['math.exchange.split-ten','math.placevalue.conservation'],lesson:8,diagnostic:true});
const byId=Object.fromEntries(TASKS.map(t=>[t.id,t]));
const statusNames={independent:'Самостоятельно',assisted:'С помощью',incorrect:'Пока не получилось',skipped:'Пропущено',notchecked:'Не проверено'};
const copy=v=>JSON.parse(JSON.stringify(v));
function current(pv){return pv&&Array.isArray(pv.queue)&&Number.isInteger(pv.index)&&byId[pv.queue[pv.index]]||null;}
function blankZones(K){return {a:K.empty(),b:K.empty(),removed:K.empty()};}
function fromCounts(p,K){const out=K.empty();for(const k of Object.keys(out))out[k]=p[k]||0;return out;}
function diagnosticQueue(learning,LP){
 const items=TASKS.filter(t=>t.diagnostic);
 const ranked=items.map((t,i)=>({id:t.id,family:t.familyId,i,priority:Math.max(...t.skillIds.map(id=>{const s=LP?LP.status(learning,id):'notchecked';return s==='incorrect'?4:s==='notchecked'?3:s==='skipped'?2:s==='assisted'?1:0;}))})).sort((a,b)=>b.priority-a.priority||a.i-b.i);
 const families=new Set(),queue=[];for(const item of ranked){if(families.has(item.family))continue;families.add(item.family);queue.push(item.id);if(queue.length===3)break;}return queue;
}
function prepare(state,K,LP){
 const t=current(state.pv);if(!t)return;
 state.zones=blankZones(K);state.answer='';state.solved=false;state.selected=null;state.undo=[];state.feedback=null;
 state.pv.answers=[];state.pv.digits=t.initialDigits?copy(t.initialDigits):[null,null,null];state.pv.selectedDigit=null;state.pv.choice='';state.pv.teaching=false;state.pv.frame=0;state.pv.help={explanation:false,visual:false,afterError:false,workedExample:false};state.pv.errors=0;state.pv.firstOutcome='notchecked';state.pv.recorded=false;state.pv.finished=false;state.pv.skipped=false;state.pv.predictionConfirmed=false;state.pv.meaningActive=false;state.pv.meaningDone=false;state.pv.meaningAnswer='';state.pv.meaningAttempt=null;state.pv.clarificationDone=false;
 state.pv.attempt=LP?LP.attempt(t.id,t.skillIds,{variantId:'v1',familyId:t.familyId}):null;
 if(t.initial)state.zones.a=fromCounts(t.initial,K);
 else if(t.kind==='read')state.zones.a=K.parts(t.model,{unitsOnly:true});
 else if(t.kind==='arithmetic'||t.kind==='expression'){state.zones.a=K.parts(t.a,{unitsOnly:true});if(t.op==='+')state.zones.b=K.parts(t.b,{unitsOnly:true});}
}
function start(state,track,K,LP,learning,id){
 let queue=track==='diagnostic'?diagnosticQueue(learning,LP):TASKS.filter(t=>!t.diagnostic).map(t=>t.id);
 if(id&&byId[id]){track=byId[id].diagnostic?'diagnostic':'practice';queue=track==='diagnostic'?[id]:TASKS.filter(t=>!t.diagnostic).map(t=>t.id);}
 state.view='placevalue';state.pv={version:1,track,queue,index:id?Math.max(0,queue.indexOf(id)):0};state.pvConflict=false;prepare(state,K,LP);
}
function restore(raw,K,LP){
 if(!raw||raw.version!==1||!raw.pv||raw.pv.version!==1||!Array.isArray(raw.pv.queue)||!raw.pv.queue.length||raw.pv.queue.some(id=>!byId[id]))return null;
 const pv=copy(raw.pv);if(!Number.isInteger(pv.index)||pv.index<0||pv.index>=pv.queue.length)return null;
 if(!['practice','diagnostic'].includes(pv.track))return null;
 const zones=blankZones(K);
 for(const zone of Object.keys(zones)){if(!raw.zones||!raw.zones[zone])return null;for(const key of Object.keys(K.values)){const n=raw.zones[zone][key];if(!Number.isInteger(n)||n<0||n*K.values[key]>1000)return null;zones[zone][key]=n;}if(K.total(zones[zone])>1000)return null;}
 pv.answers=Array.isArray(pv.answers)?pv.answers.slice(0,4).map(s=>String(s||'').replace(/[^0-9]/g,'').slice(0,4)):[];
 pv.digits=Array.isArray(pv.digits)&&pv.digits.length===3?pv.digits.map(n=>Number.isInteger(n)&&n>=0&&n<=9?n:null):[null,null,null];
 pv.help=Object.fromEntries(['explanation','visual','afterError','workedExample'].map(k=>[k,!!(pv.help&&pv.help[k]===true)]));pv.errors=Number.isInteger(pv.errors)?Math.min(100,Math.max(0,pv.errors)):0;pv.frame=Number.isInteger(pv.frame)?Math.max(0,Math.min(15,pv.frame)):0;
 pv.selectedDigit=Number.isInteger(pv.selectedDigit)&&pv.selectedDigit>=0&&pv.selectedDigit<=9?pv.selectedDigit:null;
 for(const flag of ['teaching','finished','skipped','predictionConfirmed','meaningActive','meaningDone','clarificationDone'])pv[flag]=pv[flag]===true;
 pv.meaningAnswer=typeof pv.meaningAnswer==='string'?pv.meaningAnswer.replace(/[^0-9]/g,'').slice(0,4):'';
 const undo=Array.isArray(raw.undo)?raw.undo.slice(-20).filter(x=>{try{return !!restore({version:1,pv:{version:1,track:pv.track,queue:pv.queue,index:pv.index},zones:JSON.parse(x)},K,LP);}catch(_){return false;}}):[];
 return {view:'placevalue',pv,zones,answer:String(raw.answer||'').replace(/[^0-9]/g,'').slice(0,4),undo,solved:raw.solved===true,feedback:raw.feedback&&typeof raw.feedback.text==='string'?{text:raw.feedback.text.slice(0,1000),type:raw.feedback.type==='success'?'success':'hint'}:null,selected:null};
}
function snapshot(state){return {version:1,pv:copy(state.pv),zones:copy(state.zones),answer:state.answer,undo:state.undo.slice(-20),solved:state.solved,feedback:state.feedback};}
function boardTask(t){return ['build','exchange','arithmetic','predict','conservation'].includes(t.kind);}
function fixedModel(p,env,label){return `<div class="pv-fixed-model" role="group" aria-label="${env.esc(label||'Предметная модель. Посчитай группы и клетки.')}" tabindex="0"><div class="mini-pieces">${env.pieces(p,'',true)||'<span>Нет предметов</span>'}</div></div>`;}
function fields(state,labels,env){return `<div class="pv-fields">${labels.map((label,i)=>`<label>${env.esc(label)}<input data-pv-field="${i}" inputmode="numeric" maxlength="4" autocomplete="off" value="${env.esc(state.pv.answers[i]||'')}" ${state.solved?'disabled':''}></label>`).join('')}</div>`;}
function table(state,env,interactive){return `<div class="pv-place-table" role="group" aria-label="Разрядная таблица">${['Сотни','Десятки','Единицы'].map((label,i)=>`<div><strong>${label}</strong>${interactive?`<button data-pv-action="place" data-place="${i}" class="pv-digit-slot" aria-label="${label}: ${state.pv.digits[i]===null?'пустая ячейка':state.pv.digits[i]}" ${state.solved?'disabled':''}>${state.pv.digits[i]===null?'?':state.pv.digits[i]}</button>`:`<b>${state.pv.digits[i]===null?'?':state.pv.digits[i]}</b>`}</div>`).join('')}</div>`;}
function input(state,env,label){return `<label class="pv-answer-label" for="pv-answer">${env.esc(label||'Мой ответ')}<input id="pv-answer" inputmode="numeric" autocomplete="off" maxlength="4" value="${env.esc(state.answer)}" ${state.solved?'disabled':''}></label>`;}
function modelPanel(state,env){const t=current(state.pv),single=t.kind!=='arithmetic';const tools=t.kind==='predict'&&!state.pv.predictionConfirmed?env.exchangeTools().replace(/<button /g,'<button disabled '):env.exchangeTools();return `<div class="board pv-board ${single?'single-board':''} ${Object.values(state.zones).some(p=>p.hundred>0)?'has-hundred':''}">${env.zone('a',t.kind==='build'?'Моя постройка':'На поле','Количество подсчитай сам')}${t.kind==='arithmetic'?env.zone(t.op==='+'?'b':'removed',t.op==='+'?'Добавляем':'Убрали',t.op==='+'?'Переноси в первую группу':`Нужно убрать ${t.b}`):''}</div>${t.kind==='build'?env.bank():''}${tools}<div class="board-actions"><button class="btn ghost" data-pv-action="reset">Заново</button><button class="btn ghost" data-action="undo" ${state.solved||!state.undo.length?'disabled':''}>Отменить</button>${t.kind==='arithmetic'&&t.op==='+'?`<button class="btn secondary" data-action="combine" ${state.solved||env.K.total(state.zones.b)===0?'disabled':''}>Соединить группы</button>`:''}</div>`;}
function usesHundred(t){return !!(t.initial&&t.initial.hundred>0||t.a>=100||t.model>=100||t.target>=100);}
function hintFor(t){if(['digits','fix','expand'].includes(t.kind))return 'Сотни занимают третье место справа, десятки — второе, единицы — первое. Если групп нет, на их месте нужен ноль.';if(t.kind==='value'||t.kind==='compare')return 'Одна и та же цифра имеет разную стоимость. Вспомни, сколько единиц в одной группе на её месте.';if(t.kind==='conservation')return 'Сотню можно заменить ровно десятью десятками, а один десяток — десятью единицами. Ничего нового извне не добавляется.';if(t.kind==='predict'||t.kind==='exchange')return 'Ровно десять групп одного разряда можно заменить одной группой следующего. Остальные группы не меняются.';if(t.kind==='arithmetic')return t.op==='+'?'Добавляй предметы. Ровно десять единиц меняются на десяток, десять десятков — на сотню.':'Если отдельных единиц не хватает, получи десятки из сотни, затем единицы из десятка. Обмен сохраняет количество.';return 'Одна синяя клетка — единица. В палочке десять таких клеток, в квадрате сто. Посчитай каждую группу по её величине.';}
function renderTeaching(state,env){const t=current(state.pv);if(t.kind!=='arithmetic')return `<div class="pv-explanation"><h3>Разберёмся на другом числе</h3><p>${env.esc(hintFor(t))}</p><p>Например, 124 — это сотня, два десятка и четыре единицы: 100 + 20 + 4.</p>${fixedModel(env.K.parts(124,{unitsOnly:true}),env,'Пример: сто двадцать четыре')}<button class="btn primary" data-pv-action="return">Вернуться к моей задаче</button></div>`;
 const plan=env.P.explanation(t,env.K),frames=[plan.initial,...plan.transformations,plan.final],f=frames[Math.min(state.pv.frame,frames.length-1)];return `<div class="pv-explanation" data-pv-teach-operation="${f.operation}"><div class="equation">${t.a} ${t.op==='+'?'+':'−'} ${t.b} = ${f.phase==='final'?t.result:'?'}</div><h3>${env.esc(f.label)}</h3><p>${env.esc(f.caption)}</p><div class="pv-teach-models">${['a','b','removed'].filter(k=>k==='a'||env.K.total(f.zones[k])>0).map(k=>`<div><strong>${k==='removed'?'Убрали':k==='b'?'Добавляем':'На поле'}</strong>${fixedModel(f.zones[k],env,'Учебный пример')}<p>${env.esc(env.P.describe(f.zones[k],env.K).actualText)}${f.showTotal?' = '+env.K.total(f.zones[k]):''}</p></div>`).join('')}</div>${f.conservationText?`<p class="pv-conservation">${env.esc(f.conservationText)}</p>`:''}<div class="board-actions"><button class="btn ghost" data-pv-action="teach-back" ${state.pv.frame===0?'disabled':''}>Назад</button>${state.pv.frame<frames.length-1?`<button class="btn primary" data-pv-action="teach-next">${env.esc(f.actionLabel)}</button>`:''}<button class="btn secondary" data-pv-action="return">Вернуться к задаче</button></div><p class="muted">Разбор — помощь. Следующее новое задание можно выполнить самостоятельно.</p></div>`;}
function render(state,env){
 const pv=state.pv,t=current(pv);if(!t)return '<section class="lesson-panel"><h2>Выбери задание</h2></section>';
 const supported=env.LP?env.LP.clean(env.learning):{observations:[]};
 const nav=pv.meaningActive&&!pv.meaningDone?'':pv.track==='diagnostic'?`<p class="muted">Короткая проверка · карточка ${pv.index+1} из ${pv.queue.length}. Можно пропустить или закончить.</p>`:`<label class="pv-task-picker">Выбрать упражнение<select data-pv-task-select>${TASKS.filter(x=>!x.diagnostic).map((x,i)=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${i+1}. ${env.esc(x.title)}${x.kind==='arithmetic'?' · '+x.a+(x.op==='+'?'+':'−')+x.b:''}</option>`).join('')}</select></label>`;
 let content='';
 if(pv.teaching)content=renderTeaching(state,env);
 else if(pv.meaningActive&&!pv.meaningDone)content=`<section class="pv-meaning" data-pv-meaning-active><h3>А почему так?</h3><p>15 + 12 = 27. Сколько единиц обозначают две цифры 1 в десятках чисел 15 и 12 вместе?</p><label>Мой ответ<input id="pv-meaning-answer" inputmode="numeric" maxlength="4" value="${env.esc(pv.meaningAnswer||'')}"></label><button class="btn secondary" data-pv-action="meaning-check">Проверить смысл</button><button class="btn ghost" data-pv-action="meaning-skip">Позже</button>${state.feedback?`<div class="feedback ${state.feedback.type}" role="status">${env.esc(state.feedback.text)}</div>`:''}</section>`;
 else if(pv.finished)content=`<h3>На сегодня достаточно</h3><p>Показано ${pv.queue.length} карточки. Не все навыки обязательно проверять за один раз.</p>${renderSkills(env.learning,env.LP,env.esc)}<button class="btn primary" data-pv-open="practice">К упражнениям</button>`;
 else{
  content=`<p class="activity-instruction">${env.esc(t.prompt)}</p>`;
  if(t.kind==='arithmetic')content+=`<div class="equation">${t.a} ${t.op==='+'?'+':'−'} ${t.b} = <span class="eq-answer">${state.solved&&!pv.skipped?t.result:'?'}</span></div>`;
  if(boardTask(t))content+=modelPanel(state,env);
  else if(t.kind==='read')content+=fixedModel(state.zones.a,env);
  else if(t.kind==='expression')content+=`<div class="pv-two-models">${fixedModel(state.zones.a,env,'Первое количество')}<b>+</b>${fixedModel(state.zones.b,env,'Второе количество')}</div>`;
  if(t.kind==='digits'||t.kind==='fix'){
   content+=table(state,env,true)+`<div class="pv-digit-bank" role="group" aria-label="Цифры для размещения">${Array.from({length:10},(_,n)=>`<button draggable="true" data-pv-action="digit" data-digit="${n}" class="${pv.selectedDigit===n?'selected':''}" ${state.solved?'disabled':''}>${n}</button>`).join('')}</div><p class="muted">Выбери цифру и нажми на её место. Можно перетащить мышкой или пальцем.</p>`;
   if(pv.digits.every(n=>n!==null)){const n=pv.digits[0]*100+pv.digits[1]*10+pv.digits[2];content+=fixedModel(env.K.parts(n,{unitsOnly:true}),env,'Модель твоей записи');}
  }else if(t.kind==='expand')content+=fields(state,['Сотни: величина','Десятки: величина','Единицы: величина'],env);
  else if(t.kind==='compare')content+=fields(state,t.numbers.map(n=>'Цифра 4 в '+n),env);
  else if(t.kind==='predict')content+=fields(state,['После обмена: сотен','После обмена: десятков','После обмена: единиц'],env)+`<p class="muted">Кнопки обмена можно использовать после проверки прогноза. До этого модель не меняется.</p>`;
  else if(t.kind==='conservation')content+=`<div class="pv-choice-row">${[['same','Столько же'],['more','Больше'],['less','Меньше']].map(([id,label])=>`<button class="btn secondary ${pv.choice===id?'selected':''}" data-pv-action="choice" data-choice="${id}" ${state.solved?'disabled':''}>${label}</button>`).join('')}</div>`+input(state,env,'Общее количество после размена');
  else if(t.kind==='expression')content+=fields(state,['Первое число','Второе число','Результат','Все палочки обозначают единиц'],env);
  else content+=input(state,env,t.kind==='build'?'Какое число ты построил?':'Мой ответ');
  if(!state.solved)content+=`<div class="pv-check-row"><button class="btn primary" data-pv-action="check">Проверить</button><button class="btn ghost" data-pv-action="hint">Подсказка</button><button class="btn ghost" data-pv-action="explain">Разобраться с примером</button>${pv.track==='diagnostic'?'<button class="btn ghost" data-pv-action="skip">Пропустить</button>':''}</div>`;
  else content+=`<div class="pv-check-row"><button class="btn primary" data-pv-action="next">Дальше</button></div>`;
  if(state.feedback)content+=`<div class="feedback ${state.feedback.type}" role="status">${env.esc(state.feedback.text)}</div>`;
  if(state.solved&&!pv.skipped)content+=`<div class="pv-reviewed"><p>${solutionText(t,env)}</p>${env.K.total(state.zones.a)===1000?'<p>10 сотен — одна тысяча. Запись: 1000. Для неё нужен следующий разряд.</p>':''}</div>`;
  if(state.solved&&!pv.skipped&&t.id==='pv.arithmetic.add.15.12')content+=pv.meaningActive&&!pv.meaningDone?`<section class="pv-meaning"><h3>А почему так?</h3><p>Сколько единиц обозначают две цифры 1 в десятках чисел 15 и 12 вместе?</p><label>Мой ответ<input id="pv-meaning-answer" inputmode="numeric" maxlength="4" value="${env.esc(pv.meaningAnswer||'')}"></label><button class="btn secondary" data-pv-action="meaning-check">Проверить смысл</button><button class="btn ghost" data-pv-action="meaning-skip">Позже</button></section>`:!pv.meaningDone?'<button class="btn secondary" data-pv-action="meaning-open">Один вопрос на понимание</button>':'<p class="pv-conservation">Каждая цифра 1 обозначает десяток: 10 + 10 = 20 единиц.</p>';
  if(pv.errors&&!state.solved)content+=`<div class="pv-remediation"><p>Одна ошибка ещё не определяет причину. Проверим короткую связь: ${usesHundred(t)?'сколько десятков в одной сотне?':'сколько единиц в одном десятке?'}</p><div class="pv-choice-row">${[1,10,100].map(n=>`<button class="btn secondary" data-pv-action="clarify" data-value="${n}">${n}</button>`).join('')}</div><p>Можно вернуться к знакомому объяснению.</p><button class="btn ghost" data-lesson="${t.lesson}">Открыть подходящий урок ${t.lesson}</button></div>`;
 }

function worksheet(){let ts=tasks();return `<div class="activity-wrap"><div class="activity-top"><span class="step-tag">РАБОЧАЯ ТЕТРАДЬ</span><span class="muted">16 примеров + 2 сборки</span></div><p class="worksheet-intro">Впиши пропущенные числа. Если трудно — открой пример с кубиками.</p><div class="worksheet-grid">${ts.slice(0,16).map((t,i)=>{let solved=modeDone('worksheet',state.lesson,i);return `<div class="worksheet-item ${solved?'solved':''}" data-ws="${i}"><small>${i+1}.</small><div class="ws-equation">${t.missing==='a'?wsInput(i,t,solved):t.a} ${t.op==='-'?'−':'+'} ${t.missing==='b'?wsInput(i,t,solved):t.b} = ${t.missing==='result'?wsInput(i,t,solved):t.result}</div><button class="icon-btn" data-practice="${i}" data-owner="worksheet" aria-label="Пример ${i+1}: решить с кубиками">${icon('cube')}</button></div>`;}).join('')}</div><div class="board-actions"><button class="btn ghost" data-action="hint">${icon('bulb')} Помощь</button><button class="btn primary" data-action="check-worksheet">Проверить ответы ${icon('check')}</button></div>${feedbackView()}<div class="draw-tasks"><h3>А теперь собери ответ</h3><p class="muted">Вместо рисунка в тетради — настоящая сборка из кубиков.</p>${ts.slice(16).map((t,i)=>`<button class="draw-task ${modeDone('worksheet',state.lesson,i+16)?'done':''}" data-practice="${i+16}" data-owner="worksheet"><span class="list-number">${i+17}</span><strong>${t.a} ${t.op==='-'?'−':'+'} ${t.b} = ?</strong><span>${modeDone('worksheet',state.lesson,i+16)?'✓ Решено · повторить':'Собрать'} ${icon('arrow')}</span></button>`).join('')}</div></div>`;}

 if(state.mode==='worksheet'&&!state.worksheetTask){feedback('Впиши число в пустое окошко. Нажми на значок кубика у примера, чтобы решить его на поле.');render();return;}
 const t=task(),p=state.zones.a;
 let text=isBuild()?`Собери число на месте вопроса: ${esc(t.text||`${t.a} ${t.op} ${t.b} = ?`)}. Палочка — 10, кубик — 1.`:t.op==='+'?(K.total(state.zones.b)>0?'Перенеси кубики из правой группы в левую. Можно нажать «Соединить всё».':p.unit>=10?'На поле 10 или больше единиц. Нажми «10 единиц → десяток».':p.ten>=10?'Десять десятков — это сотня. Собери её кнопкой обмена.':'Посчитай десятки и единицы на левом поле, затем запиши ответ.'):(K.total(state.zones.removed)>t.b?'Ты убрал больше, чем нужно. Верни лишние кубики или отмени последнее действие.':p.unit<t.b%10-(state.zones.removed.unit%10)&&p.ten>0?'Не хватает отдельных единиц? Нажми «Десяток → 10 единиц».':p.hundred>0&&t.b>0?'Разбери сотню на 10 десятков, затем убирай нужные палочки и кубики.':`Справа должно оказаться ровно ${t.b}. Остальное останется слева — это ответ.`);
 feedback(text);render();
}
function checkAnswer(){const t=task(),raw=$('#answer').value.trim();if(!/^\d{1,4}$/.test(raw)){feedback('Впиши пропущенное число в окошко ответа.','error');render();$('#answer').focus();return;}
 if(Number(raw)!==t.answer){observeLegacy('incorrect');feedback('Пока не сходится. Посчитай кубики ещё раз. Можно воспользоваться подсказкой.','error');render();return;}
 if(!K.check(t,state.zones,isBuild())){observeLegacy('incorrect');feedback(isBuild()?'Число верное! Теперь собери его на поле. Единиц должно быть меньше 10 — собирай их в десятки.':t.op==='+'?'Ответ верный! Осталось перенести все кубики влево и собрать полные десятки.':'Ответ верный! Теперь покажи вычитание: убери нужное количество вправо, а ответ оставь слева.','hint');render();return;}
 const mode=activeTaskMode(),repeating=state.repeating;
 observeLegacy('correct');state.solved=true;state.selected=null;if(!state.demo)markModeDone(mode,state.lesson,state.index);save();
 if(!state.demo&&!repeating&&modeCount(state.lesson,mode)===18){const completed=mode;continueRoute(state.lesson);feedback(completed==='play'&&state.mode==='worksheet'?'Игра пройдена! Теперь решим задания тетради самостоятельно.':state.mode==='learn'?'Этап завершён. Сначала разберём правило урока.':'Этап завершён. Продолжаем маршрут.','success');render();celebrate();return;}
 feedback(state.demo?'Всё получилось! Теперь попробуй задания урока.':repeating?'Повторение получилось. Можно продолжить маршрут.':'Здорово! И ответ, и кубики на своих местах.','success');render();celebrate();}
function nextTask(){
 stopVoice();
 if(state.repeating){continueRoute(state.lesson);renderFresh();return;}
 const mode=activeTaskMode(),next=firstModeTask(state.lesson,mode,state.demo?-1:state.index);
 if(next<0||!progress.read.includes(state.lesson))continueRoute(state.lesson);
 else if(mode==='worksheet'){if(next>=16)startTask(state.lesson,next,false,'worksheet');else backToWorksheet();}
 else startTask(state.lesson,next);
 renderFresh();
}
function checkWorksheet(){let answered=0,correct=0,wrong=0;$$('[data-ws-input]:not(:disabled)').forEach(input=>{let v=input.value.trim();if(!v)return;answered++;const idx=+input.dataset.wsInput,t=tasks()[idx];if(/^\d{1,4}$/.test(v)&&Number(v)===t.answer){markModeDone('worksheet',state.lesson,idx);correct++;}else{wrong++;input.setAttribute('aria-invalid','true');input.closest('.worksheet-item').classList.add('wrong');}});save();
 if(modeCount(state.lesson,'worksheet')===18&&!state.repeating){continueRoute(state.lesson);feedback('Тетрадь пройдена! Продолжаем со следующего непройденного этапа.','success');render();celebrate();return;}
 const text=!answered?'Впиши ответы хотя бы в один пример.':wrong?`Верно: ${correct}. Ещё подумай над ${wrong} — они отмечены розовым.`:`Отлично! Проверено верных ответов: ${correct}. Осталось решить задания без галочки.`;state.feedback={text,type:wrong?'error':correct?'success':'hint'};render();announce(text);if(correct&&!wrong)celebrate();}

function celebrate(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const div=document.createElement('div');div.className='confetti';div.setAttribute('aria-hidden','true');div.innerHTML=Array.from({length:22},(_,i)=>`<i style="--x:${Math.random()*100}vw;--r:${Math.random()*600}deg;--delay:${Math.random()*.3}s;background:${['#64b9e5','#f6ce60','#93c7b6','#b8a4e3'][i%4]}"></i>`).join('');document.body.append(div);setTimeout(()=>div.remove(),1800);}
function modal(content){lastModalFocus=document.activeElement;$('#overlay').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="icon-btn modal-close" data-action="close-modal" aria-label="Закрыть">${icon('close')}</button>${content}</section></div>`;$('.modal-close').focus();}
let lastModalFocus=null;
function closeModal(){$('#overlay').innerHTML='';lastModalFocus?.focus();}
function help(){stopVoice();modal(`<span class="tip-icon">${icon('cube')}</span><h2 id="modal-title">Знакомься, это кубики</h2><p>Синий кубик — <b>1 единица</b>. Жёлтая палочка — <b>10 единиц</b>. Фиолетовый квадрат — <b>100</b>.</p><ol class="help-list"><li><b>Передвигай.</b> Перетаскивай кубик мышкой или пальцем. Или нажми на него, затем на нужную область. Клавиатурой: выбери кубик через Tab и Enter, затем перейди Tab к области и нажми Enter.</li><li><b>Меняй.</b> Десять кубиков можно собрать в палочку. Палочку можно разменять обратно. Количество остаётся прежним.</li><li><b>Проверяй.</b> Покажи действие на поле и впиши ответ. Если ошибёшься, подсказка поможет.</li></ol><p><b>Каждый урок идёт по шагам:</b> разбор правила → 18 задач в игре → 18 задач в тетради → следующий урок. Игра и тетрадь отмечаются отдельно.</p><p class="muted">В мастерской можно свободно собирать числа. Прогресс хранится в этом браузере. Задания в скачанном HTML работают без интернета. Для женской озвучки нужен интернет.</p><p class="muted"><a href="voice-credits.txt" target="_blank" rel="noopener">Об озвучке</a></p><button class="btn primary" data-action="download">${icon('download')} Скачать для занятий офлайн</button>`);}
async function download(){await window.TrainerBundle.download($('[data-action="download"]'));}
// Recorded lessons keep the same voice on every device. Unknown operands stay unknown.
let voiceSession=0,voicePlaying=false;
function voiceButton(){const button=$('[data-action="speak"]');if(!button)return;button.setAttribute('aria-label',voicePlaying?'Остановить озвучку':'Послушать задание женским голосом');button.setAttribute('aria-pressed',String(voicePlaying));button.setAttribute('title',voicePlaying?'Остановить':'Послушать');button.innerHTML=icon(voicePlaying?'close':'sound');}
function stopVoice(){voiceSession++;voicePlaying=false;if(window.RecordedVoice)window.RecordedVoice.stop();voiceButton();}
function spokenNumber(n){const units=['ноль','один','два','три','четыре','пять','шесть','семь','восемь','девять','десять','одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать','шестнадцать','семнадцать','восемнадцать','девятнадцать'],tens=['','','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто'];if(n===100)return 'сто';if(n<20)return units[n];return tens[Math.floor(n/10)]+(n%10?' '+units[n%10]:'');}
function taskVoice(){const t=task(),a=t.missing==='a'?'неизвестное число':spokenNumber(t.a),b=t.missing==='b'?'неизвестное число':spokenNumber(t.b);return [`${a} ${t.op==='+'?'плюс':'минус'} ${b}${t.missing!=='result'?` равно ${spokenNumber(t.result)}`:''}.`,isBuild()?'Собери пропущенное число.':'Передвинь кубики и запиши ответ.'];}
function speak(){
 if(voicePlaying){stopVoice();return;}
 if(!window.RecordedVoice){feedback('Не удалось загрузить озвучку. Проверь интернет и обнови страницу.','hint');render();return;}
 const id=++voiceSession;voicePlaying=true;voiceButton();
 const end=()=>{if(id!==voiceSession)return;voicePlaying=false;voiceButton();};
 const started=window.RecordedVoice.speak(state.mode==='learn'?`${lesson().title}. ${lesson().rule}`:taskVoice(),{onEnd:end,onError:message=>{if(id!==voiceSession)return;end();feedback(message||'Не удалось включить озвучку. Проверь интернет и нажми ещё раз.','hint');render();}});
 if(started===false)end();
}
// Delegated navigation keeps all controls available after a board redraw.
document.addEventListener('click',event=>{
 if(booting)return;const el=event.target.closest('button,a');if(!el||el.disabled)return;userIntent=true;if((el.dataset.exchange||el.dataset.action==='learn-next')&&M.isBusy())return;if(!el.dataset.exchange)M.cancel();
 if(el.dataset.pvOpen){openPlaceValue(el.dataset.pvOpen);return;}
 if(el.dataset.pvAction){if(suppressPvClick){suppressPvClick=false;return;}if(el.dataset.pvAction==='reload'){reloadPlaceValue();return;}A.capture(state,document);if(A.handle(state,el.dataset.pvAction,el.dataset,pvEnv())){pvDirty=true;if(['next','reset'].includes(el.dataset.pvAction))$('#app').dataset.context='';render();}return;}
 if(state.view==='placevalue'&&state.pvConflict&&el.dataset.view===undefined&&el.dataset.lesson===undefined)return;
 if(el.dataset.lesson){chooseLesson(+el.dataset.lesson);return;}
 if(el.dataset.view){save();stopVoice();if(el.dataset.view==='trainer')resumeTraining(true);else if(el.dataset.view==='workshop')openWorkshop();else{state.view=el.dataset.view;state.feedback=null;state.selected=null;}renderFresh();window.scrollTo(0,0);return;}
 if(el.dataset.mode){stopVoice();selectMode(el.dataset.mode);return;}
 if(el.dataset.practice){openPractice(+el.dataset.practice,el.dataset.owner==='worksheet'?'worksheet':activeTaskMode());return;}
 if(el.dataset.exchange){exchangeOnBoard(el.dataset.exchange);return;}
 if(el.dataset.piece){if(suppressClick){suppressClick=false;return;}if(state.solved)return;const from=el.dataset.from,type=el.dataset.piece;if(from==='bank'){movePiece(from,'a',type);return;}if(state.view==='workshop'){mutate(()=>{state.zones.a[type]--;return true;});return;}if(state.selected?.from===from&&state.selected?.type===type){state.selected=null;$$('.selected-piece').forEach(p=>p.classList.remove('selected-piece'));return;}state.selected={from,type};$$('.selected-piece').forEach(p=>p.classList.remove('selected-piece'));el.classList.add('selected-piece');announce('Кубик выбран. Нажми на область назначения.');return;}
 const action=el.dataset.action;if(!action)return;event.preventDefault();
 if(action==='home'){save();resumeTraining(true);renderFresh();}
 else if(action==='help'){if(state.view==='placevalue'){A.assist(state,'explanation',LP);pvDirty=true;save();}help();}
 else if(action==='close-modal')closeModal();
 else if(action==='speak')speak();
 else if(action==='hint')hint();
 else if(action==='check')checkAnswer();
 else if(action==='check-worksheet')checkWorksheet();
 else if(action==='next-task')nextTask();
 else if(action==='back-worksheet')backToWorksheet();
 else if(action==='continue-route'){save();continueRoute(state.lesson);renderFresh();}
 else if(action==='prev-lesson')chooseLesson(Math.max(1,state.lesson-1));
 else if(action==='reset'){if(state.view==='placevalue'){A.handle(state,'reset',{},pvEnv());pvDirty=true;$('#app').dataset.context='';}else if(state.view==='workshop'){state.zones={a:K.empty(),b:K.empty(),removed:K.empty()};state.undo=[];state.feedback=null;state.solved=false;}else setup();renderFresh();}
 else if(action==='undo'){if(state.undo.length){state.zones=JSON.parse(state.undo.pop());state.selected=null;state.feedback=null;if(state.view==='placevalue')pvDirty=true;render();}}
 else if(action==='combine'){mutate(()=>{['unit','ten','hundred'].forEach(type=>{state.zones.a[type]+=state.zones.b[type];state.zones.b[type]=0;});return true;});}
 else if(action==='learn-back')advanceExplanation(-1);
 else if(action==='learn-next')advanceExplanation(1);
 else if(action==='random-target'){state.freeTarget=Math.floor(Math.random()*1001);state.zones={a:K.empty(),b:K.empty(),removed:K.empty()};state.undo=[];state.feedback=null;render();}
 else if(action==='check-free'){feedback(K.total(state.zones.a)===state.freeTarget?K.canonical(state.zones.a)?`Получилось! Ты собрал ${state.freeTarget}: ${nice(state.freeTarget)}.`:`Число ${state.freeTarget} собрано! Теперь объедини полные десятки и сотню.`:`Сейчас на поле ${K.total(state.zones.a)}, а нужно ${state.freeTarget}. Добавь или убери кубики.`,K.total(state.zones.a)===state.freeTarget?'success':'hint');render();if(K.total(state.zones.a)===state.freeTarget&&K.canonical(state.zones.a))celebrate();}
 else if(action==='reset-progress')modal(`<h2 id="modal-title">Начать сначала?</h2><p>Будут удалены отметки о решённых заданиях на этом устройстве.</p><div class="board-actions"><button class="btn secondary" data-action="close-modal">Оставить прогресс</button><button class="btn primary" data-action="confirm-reset-progress">Начать заново</button></div>`);
 else if(action==='confirm-reset-progress'){pendingModeAwards.clear();pendingReadAwards.clear();resetting=true;progress={solved:{},read:[],worksheet:{},modeSolved:{version:1,play:{},worksheet:{}},modeSessions:{},resetEpoch:Date.now()+':'+Math.random()};if(LP)progress.learning=LP.empty(progress.resetEpoch);storageBlocked=false;state.pvConflict=false;state.pv=null;closeModal();continueRoute(1);renderFresh();}
 else if(action==='download')download();
});
document.addEventListener('click',event=>{if(event.target.closest('[data-piece]'))return;const zone=event.target.closest('[data-zone]');if(zone&&state.selected){movePiece(state.selected.from,zone.dataset.zone,state.selected.type);}});
document.addEventListener('keydown',e=>{if(booting)return;if(e.key==='Escape'){stopVoice();if($('#overlay').innerHTML){closeModal();return;}state.selected=null;render();}if(e.key==='Enter'&&e.target.id==='answer')checkAnswer();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-zone]')){e.preventDefault();if(state.selected)movePiece(state.selected.from,e.target.dataset.zone,state.selected.type);}if(e.key==='Tab'&&$('.modal')){const fs=[...$('.modal').querySelectorAll('button,a,input')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===fs[0]){e.preventDefault();fs[fs.length-1].focus();}else if(!e.shiftKey&&document.activeElement===fs[fs.length-1]){e.preventDefault();fs[0].focus();}}});
document.addEventListener('input',e=>{userIntent=true;if(state.view==='placevalue'){if(e.target.id==='pv-meaning-answer'){state.pv.meaningAnswer=numericDraft(e.target.value);pvDirty=true;}else if(A.capture(state,document))pvDirty=true;save();return;}if(e.target.id==='answer'||e.target.matches('[data-ws-input]')){e.target.value=e.target.value.replace(/[^0-9]/g,'').slice(0,4);e.target.removeAttribute('aria-invalid');e.target.closest('.worksheet-item')?.classList.remove('wrong');}if(e.target.id==='free-target'){let n=Number(e.target.value);if(Number.isInteger(n)&&n>=0&&n<=R.MAX){state.freeTarget=n;state.feedback=null;}}save();});
document.addEventListener('change',e=>{userIntent=true;if(e.target.matches('[data-pv-task-select]')){openPlaceValue('practice',e.target.value);return;}if(e.target.id==='free-target'){e.target.value=state.freeTarget;}});
// Pointer events support mouse, stylus and touch, with a movement threshold for taps.
let drag=null, suppressClick=false;
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-piece]');if(!el||state.solved||e.button!==0)return;M.cancel();drag={id:e.pointerId,from:el.dataset.from,type:el.dataset.piece,x:e.clientX,y:e.clientY,active:false,el};el.setPointerCapture?.(e.pointerId);});
document.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;if(!drag.active&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>7){drag.active=true;const ghost=drag.el.cloneNode(true);ghost.classList.add('drag-ghost');ghost.removeAttribute('data-piece');ghost.removeAttribute('data-from');ghost.setAttribute('aria-hidden','true');document.body.append(ghost);drag.ghost=ghost;}if(drag.active){e.preventDefault();drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';$$('.drop-over').forEach(x=>x.classList.remove('drop-over'));document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-zone]')?.classList.add('drop-over');}},{passive:false});
function finishDrag(e,cancel=false){if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;d.ghost?.remove();$$('.drop-over').forEach(x=>x.classList.remove('drop-over'));if(d.active){suppressClick=true;setTimeout(()=>{suppressClick=false;},100);if(!cancel){const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-zone]');if(target)movePiece(d.from,target.dataset.zone,d.type);}}}
document.addEventListener('pointerup',e=>finishDrag(e));document.addEventListener('pointercancel',e=>finishDrag(e,true));
$('#overlay').addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))closeModal();});
// Zones are keyboard destinations even after dynamic updates.
const observer=new MutationObserver(()=>{$$('[data-zone]').forEach(z=>{z.tabIndex=0;});});observer.observe($('#app'),{childList:true,subtree:true});
// The generated canonical loader restores all version-checked dependencies
// before this app runs. A stale HTML/new app combination must never write data.
function startTrainer(){resumeTraining(true);if(progress.lastView==='workshop')openWorkshop();else if(progress.lastView==='placevalue'&&learningReady()&&!adoptPv(progress.learning.activity)){storageBlocked=true;memory=true;}render();booting=false;}
if(K&&P&&M&&LP&&A&&window.MathRange)startTrainer();
else{$('#app').innerHTML='<main style="max-width:36em;margin:12vh auto;padding:24px;font:18px/1.6 sans-serif"><h1>Завершим обновление</h1><p>Подключись к интернету и открой тренажёр ещё раз. Сохранённые результаты останутся на устройстве.</p><a href="../">Все игры</a></main>';}
if(typeof window.addEventListener==='function')window.addEventListener('pagehide',()=>{if(!booting)save(true);});
document.addEventListener('visibilitychange',()=>{if(!booting&&document.visibilityState==='hidden'){M.cancel();save(true);}});

// Digit placement uses the same tap/target pattern as the existing objects.
let pvDigitDrag=null,suppressPvClick=false;
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-pv-action="digit"]');if(!el||state.view!=='placevalue'||state.solved||state.pvConflict||e.button!==0)return;pvDigitDrag={id:e.pointerId,digit:Number(el.dataset.digit),x:e.clientX,y:e.clientY,active:false};el.setPointerCapture?.(e.pointerId);});
document.addEventListener('pointermove',e=>{if(!pvDigitDrag||pvDigitDrag.id!==e.pointerId)return;if(Math.hypot(e.clientX-pvDigitDrag.x,e.clientY-pvDigitDrag.y)>7)pvDigitDrag.active=true;if(pvDigitDrag.active)e.preventDefault();},{passive:false});
document.addEventListener('pointerup',e=>{if(!pvDigitDrag||pvDigitDrag.id!==e.pointerId)return;const drag=pvDigitDrag;pvDigitDrag=null;if(!drag.active)return;const slot=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-pv-action="place"]');if(slot){state.pv.selectedDigit=drag.digit;userIntent=true;A.handle(state,'place',slot.dataset,pvEnv());pvDirty=true;suppressPvClick=true;render();setTimeout(()=>{suppressPvClick=false;},100);}});
document.addEventListener('pointercancel',()=>{pvDigitDrag=null;});
document.addEventListener('dragstart',e=>{if(e.target.closest('[data-pv-action="digit"]'))e.preventDefault();});
if(typeof window.addEventListener==='function')window.addEventListener('storage',event=>{
 if(event.key!==STORAGE_KEY||event.newValue===lastStoredRaw)return;
 let latest;try{latest=JSON.parse(event.newValue||'{}');if(!record(latest))throw Error('invalid');}catch(_){storageBlocked=true;memory=true;return;}
 if(state.view==='placevalue'&&foreignPvConflict(latest)){blockPvWrite(latest);userIntent=false;render();}
});
