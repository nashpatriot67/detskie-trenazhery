name: Prepare reviewed room release
on:
  push:
    branches: [room-release-20261119]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild and verify reviewed static resources
        run: |
          set -euo pipefail
          node tools/build-offline.cjs
          node tests/room-progress.test.cjs
          node tests/room-adventure.test.cjs
          node tests/visual-build.test.cjs
          node tests/refine-build.test.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kubiki/index.html kubiki/offline.html bricks/index.html bricks/offline.html slovograd/index.html slovograd/offline.html life/index.html life/offline.html sw.js trainer-build.json otkryt-bez-interneta.html
          git diff --exit-code
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build reviewed room release resources'
          git push origin HEAD:refs/heads/room-release-20261119
