name: Prepare tested trainer release
on:
  push:
    branches: [trainer-animation-release-20261119]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild and verify static resources
        run: |
          set -euo pipefail
          cat .release-parts/part-000.part .release-parts/part-001.part .release-parts/part-002.part > room-game.js
          git add room-game.js
          cat .release-parts/part-003.part .release-parts/part-004.part > slovograd/app.js
          git add slovograd/app.js
          git rm -r .release-parts
          node tools/build-offline.cjs
          node tests/visual-build.test.cjs
          node tests/refine-build.test.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kubiki/index.html kubiki/offline.html bricks/index.html bricks/offline.html slovograd/index.html slovograd/offline.html life/index.html life/offline.html sw.js trainer-build.json otkryt-bez-interneta.html
          git diff --exit-code
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build tested trainer resources'
          git push origin HEAD:refs/heads/trainer-animation-release-20261119
